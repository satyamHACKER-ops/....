<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elementa — Interactive Periodic Table</title>

<style>
/* =========================================================
   ELEMENTA — INTERACTIVE PERIODIC TABLE
   Everything is contained in this single file.
   ========================================================= */

:root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-2: #eef3f8;
    --text: #142033;
    --muted: #687589;
    --border: #dbe3ec;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --shadow: 0 10px 30px rgba(20, 32, 51, 0.08);

    --alkali: #ff8a8a;
    --alkaline: #ffbd70;
    --transition: #ffd866;
    --post: #7dd3fc;
    --metalloid: #86efac;
    --nonmetal: #a7f3d0;
    --halogen: #c4b5fd;
    --noble: #f0abfc;
    --lanthanide: #f9a8d4;
    --actinide: #fdba74;
    --unknown: #cbd5e1;
}

body.dark {
    --bg: #0b1120;
    --surface: #111827;
    --surface-2: #1b2638;
    --text: #f1f5f9;
    --muted: #9aa8bb;
    --border: #29364a;
    --shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;

    background:
        radial-gradient(circle at top left,
            rgba(37, 99, 235, 0.10),
            transparent 35%),
        var(--bg);

    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 100;
}

body.dark header {
    background: rgba(17,24,39,0.80);
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand h1 {
    margin: 0;
    font-size: clamp(25px, 4vw, 40px);
    font-weight: 850;
    letter-spacing: -1.5px;
}

.brand p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

button {
    font: inherit;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.icon-btn,
.action-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s ease;
}

.icon-btn {
    width: 42px;
    height: 42px;
    font-size: 18px;
}

.action-btn {
    padding: 10px 14px;
    font-weight: 700;
}

.icon-btn:hover,
.action-btn:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
}

/* =========================================================
   MAIN
   ========================================================= */

main {
    max-width: 1500px;
    margin: auto;
    padding: 24px 18px 60px;
}

/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto auto;
    gap: 10px;
    margin-bottom: 16px;
}

.search-box {
    position: relative;
}

.search-box input {
    width: 100%;
    height: 46px;
    padding: 0 16px 0 42px;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-size: 15px;
}

.search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 13px;
    opacity: 0.55;
}

/* =========================================================
   FILTERS
   ========================================================= */

.filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 13px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
}

.filter-title {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.7px;
}

.filter-list {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.filter {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 11px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    transition: 0.2s;
}

.filter:hover {
    transform: translateY(-1px);
}

.filter.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

/* =========================================================
   TABLE CONTAINER
   ========================================================= */

.table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow);
    overflow-x: auto;
}

.table {
    min-width: 1050px;
    display: grid;
    grid-template-columns: repeat(18, minmax(55px, 1fr));
    grid-auto-rows: 78px;
    gap: 5px;
}

/* =========================================================
   ELEMENT CARD
   ========================================================= */

.element {
    position: relative;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 10px;
    padding: 6px;
    cursor: pointer;
    color: #172033;
    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        opacity 0.18s ease;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    overflow: hidden;
}

body.dark .element {
    border-color: rgba(255,255,255,0.08);
}

.element:hover {
    transform: translateY(-5px) scale(1.035);
    z-index: 5;
    box-shadow: 0 12px 25px rgba(0,0,0,0.18);
}

.element.hidden {
    opacity: 0.12;
    pointer-events: none;
}

.element .number {
    font-size: 10px;
    font-weight: 800;
    opacity: 0.7;
}

.element .symbol {
    font-size: 23px;
    line-height: 1;
    font-weight: 900;
    text-align: center;
}

.element .name {
    font-size: 9px;
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.element .mass {
    font-size: 8px;
    text-align: center;
    opacity: 0.72;
}

/* =========================================================
   CATEGORY COLORS
   ========================================================= */

.alkali { background: var(--alkali); }
.alkaline { background: var(--alkaline); }
.transition { background: var(--transition); }
.post-transition { background: var(--post); }
.metalloid { background: var(--metalloid); }
.nonmetal { background: var(--nonmetal); }
.halogen { background: var(--halogen); }
.noble { background: var(--noble); }
.lanthanide { background: var(--lanthanide); }
.actinide { background: var(--actinide); }
.unknown { background: var(--unknown); }

/* =========================================================
   SERIES
   ========================================================= */

.series {
    margin-top: 18px;
    min-width: 1050px;
}

.series-title {
    font-size: 13px;
    color: var(--muted);
    font-weight: 800;
    margin: 12px 0 8px;
}

.series-grid {
    display: grid;
    grid-template-columns: 90px repeat(15, minmax(55px, 1fr));
    gap: 5px;
}

.series-label {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
}

/* =========================================================
   LEGEND
   ========================================================= */

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-top: 18px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
}

.legend-dot {
    width: 13px;
    height: 13px;
    border-radius: 4px;
}

/* =========================================================
   DETAIL PANEL
   ========================================================= */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(5px);
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
    z-index: 200;
}

.overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.detail-panel {
    position: fixed;
    top: 0;
    right: -520px;
    width: min(500px, 94vw);
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -20px 0 50px rgba(0,0,0,0.20);
    z-index: 210;
    transition: right 0.3s ease;
    overflow-y: auto;
}

.detail-panel.open {
    right: 0;
}

.detail-top {
    padding: 22px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
}

.detail-close {
    float: right;
    border: 0;
    background: var(--surface-2);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
}

.detail-symbol {
    font-size: 72px;
    line-height: 1;
    font-weight: 950;
}

.detail-name {
    font-size: 24px;
    font-weight: 850;
    margin-top: 5px;
}

.detail-category {
    display: inline-block;
    margin-top: 9px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
}

.detail-content {
    padding: 22px;
}

.detail-description {
    line-height: 1.65;
    color: var(--muted);
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 20px 0;
}

.stat {
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 13px;
    padding: 13px;
}

.stat-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
}

.stat-value {
    font-weight: 850;
    margin-top: 4px;
    word-break: break-word;
}

.info-block {
    margin-top: 15px;
}

.info-block h3 {
    font-size: 13px;
    margin-bottom: 6px;
}

.info-block p {
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
}

/* =========================================================
   NO RESULTS
   ========================================================= */

.no-results {
    display: none;
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
}

.no-results.show {
    display: block;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    header {
        position: relative;
    }

    .header-inner {
        align-items: flex-start;
    }

    .toolbar {
        grid-template-columns: 1fr;
    }

    .table-card {
        border-radius: 15px;
        padding: 10px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .detail-symbol {
        font-size: 58px;
    }
}

/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.element {
    animation: appear 0.35s ease both;
}
</style>
</head>
