<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Elementa — interactive periodic table with all 118 elements.">
<title>Elementa — Interactive Periodic Table</title>
<style>
:root{--bg:#f4f7fb;--panel:#ffffff;--text:#0f172a;--muted:#64748b;--line:#dbe3ee;--accent:#2563eb;--shadow:0 16px 45px rgba(15,23,42,.12)}
body.dark{--bg:#0b1120;--panel:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#263244;--shadow:0 16px 45px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}
button,input{font:inherit}button{cursor:pointer}
header{padding:28px 16px 20px;text-align:center}
.brand{font-weight:950;letter-spacing:-1.5px;font-size:clamp(34px,8vw,60px)}
.brand span{color:var(--accent)}
.subtitle{color:var(--muted);margin:7px auto 0;max-width:700px;line-height:1.5}
.toolbar{position:sticky;top:0;z-index:50;background:rgba(244,247,251,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px}
body.dark .toolbar{background:rgba(11,17,32,.92)}
.toolbar-inner{max-width:1450px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:240px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:11px;font-weight:800}
.btn:hover{border-color:var(--accent)}
main{max-width:1500px;margin:auto;padding:16px 10px 50px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
.chip.active{outline:2px solid var(--accent)}
.table-scroll{overflow-x:auto;padding:12px 2px 20px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(18,minmax(50px,1fr));gap:4px;min-width:1080px}
.cell{min-height:72px;border:2px solid transparent;border-radius:9px;padding:6px;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .16s,box-shadow .16s,opacity .16s;user-select:none}
.cell:hover{transform:translateY(-3px) scale(1.035);z-index:3;box-shadow:0 10px 22px rgba(0,0,0,.18)}
.cell.dim{opacity:.16;filter:grayscale(.75)}
.cell .z{position:absolute;top:4px;left:6px;font-size:9px;font-weight:800}
.cell .sym{font-size:23px;font-weight:950;line-height:1}
.cell .name{font-size:9px;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .mass{font-size:8px;opacity:.88;margin-top:2px}
.placeholder{min-height:72px;border:1px dashed var(--line);border-radius:9px;background:rgba(148,163,184,.06);color:var(--muted);display:grid;place-items:center;text-align:center;font-size:9px;font-weight:900;padding:4px}
.series{margin-top:12px}
.series-title{margin:12px 0 6px;text-align:center;color:var(--muted);font-size:12px;font-weight:900}
.detail{display:none;max-width:850px;margin:14px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.detail.open{display:block;animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.detail-top{padding:20px;display:flex;gap:18px;align-items:flex-start}
.big-symbol{width:105px;height:105px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:950;flex:none}
.detail h2{margin:0;font-size:28px}.detail-sub{color:var(--muted);margin-top:5px;line-height:1.5}
.close{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:14px;border-right:1px solid var(--line);min-width:0}.stat:last-child{border:0}
.stat b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}.stat span{font-weight:850;overflow-wrap:anywhere}
.desc{padding:18px 20px;line-height:1.65;color:var(--muted)}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 20px}
.info{border:1px solid var(--line);border-radius:12px;padding:12px}.info small{display:block;color:var(--muted);margin-bottom:3px}
.error{display:none;margin:14px auto;max-width:850px;padding:14px 16px;border:1px solid #ef4444;border-radius:12px;background:#fff1f2;color:#991b1b;font-weight:700;line-height:1.5}
body.dark .error{background:#3b1117;color:#fecaca}
footer{text-align:center;color:var(--muted);padding:20px;font-size:12px}
@media(max-width:700px){
 header{padding:22px 12px 14px}.search{min-width:100%;order:-1}main{padding:10px 7px 35px}
 .grid{min-width:1000px;gap:3px}.cell,.placeholder{min-height:62px;border-radius:7px}.cell .sym{font-size:19px}
 .detail-top{padding:14px}.big-symbol{width:80px;height:80px;font-size:32px}.detail h2{font-size:22px}
 .stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}
 .extra{grid-template-columns:1fr;padding:0 14px 14px}
}
</style>
</head>

<header>
  <div class="brand">Element<span>a</span></div>
  <p class="subtitle">Explore all 118 chemical elements — search, filter, and tap any element for details.</p>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <input id="search" class="search" placeholder="Search name, symbol, or atomic number…" autocomplete="off" aria-label="Search elements">
    <button class="btn" id="randomBtn" type="button">🎲 Random</button>
    <button class="btn" id="themeBtn" type="button">🌙 Theme</button>
    <button class="btn" id="resetBtn" type="button">↺ Reset</button>
  </div>
</div>

<main>
  <div id="legend" class="legend"></div>
  <div id="error" class="error"></div>
  <div class="table-scroll">
    <div id="table" class="grid" role="grid" aria-label="Periodic table"></div>
    <div class="series">
      <div class="series-title">Lanthanides</div>
      <div id="lanthanides" class="grid"></div>
      <div class="series-title">Actinides</div>
      <div id="actinides" class="grid"></div>
    </div>
  </div>

  <section id="detail" class="detail" aria-live="polite">
    <div class="detail-top">
      <div id="bigSymbol" class="big-symbol"></div>
      <div>
        <h2 id="detailName"></h2>
        <div id="detailSub" class="detail-sub"></div>
      </div>
      <button id="closeBtn" class="btn close" type="button">✕</button>
    </div>
    <div class="stats">
      <div class="stat"><b>Atomic mass</b><span id="dMass"></span></div>
      <div class="stat"><b>Electron configuration</b><span id="dEC"></span></div>
      <div class="stat"><b>State</b><span id="dPhase"></span></div>
    </div>
    <div id="dDesc" class="desc"></div>
    <div class="extra">
      <div class="info"><small>Atomic number</small><b id="dZ"></b></div>
      <div class="info"><small>Category</small><b id="dCat"></b></div>
      <div class="info"><small>Group</small><b id="dGroup"></b></div>
      <div class="info"><small>Period</small><b id="dPeriod"></b></div>
      <div class="info"><small>Discovery</small><b id="dYear"></b></div>
      <div class="info"><small>Block</small><b id="dBlock"></b></div>
    </div>
  </section>
</main>
<footer>Elementa • Interactive chemistry reference • 118 elements</footer>

const colors={
  alkali:"#dc2626", alkaline:"#ea580c", transition:"#d97706", "post-transition":"#0d9488",
  metalloid:"#16a34a", nonmetal:"#0284c7", halogen:"#4f46e5", noble:"#7c3aed",
  lanthanide:"#db2777", actinide:"#e11d48"
};
const labels={
  alkali:"Alkali metals", alkaline:"Alkaline earth metals", transition:"Transition metals",
  "post-transition":"Post-transition metals", metalloid:"Metalloids", nonmetal:"Other nonmetals",
  halogen:"Halogens", noble:"Noble gases", lanthanide:"Lanthanides", actinide:"Actinides"
};

const E=raw.map((x,i)=>({
  sym:x[0],name:x[1],z:x[2],mass:x[3],cat:x[4],ec:x[5],phase:x[6],desc:x[7],year:x[8],period:x[9],group:x[10],i
}));

let active="all";
let selected=null;

function block(e){
  if(e.cat==="lanthanide"||e.cat==="actinide") return "f";
  if(e.group<=2) return "s";
  if(e.group>=13) return "p";
  return "d";
}

function passes(e){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const text=(e.name+" "+e.sym+" "+e.z).toLowerCase();
  return (active==="all"||e.cat===active)&&(!q||text.includes(q));
}

function makeCell(e){
  const b=document.createElement("button");
  b.type="button";
  b.className="cell";
  b.style.background=colors[e.cat]||"#64748b";
  b.dataset.z=e.z;
  b.setAttribute("aria-label",`${e.name}, atomic number ${e.z}`);
  b.innerHTML=`<span class="z">${e.z}</span><span class="sym">${e.sym}</span><span class="name">${e.name}</span><span class="mass">${e.mass}</span>`;
  if(!passes(e)) b.classList.add("dim");
  b.addEventListener("click",()=>show(e));
  return b;
}

function makePlaceholder(text){
  const d=document.createElement("div");
  d.className="placeholder";
  d.textContent=text;
  return d;
}

function renderLegend(){
  const l=document.getElementById("legend");
  l.innerHTML=`<button type="button" class="chip active" data-cat="all">All</button>`+
    Object.entries(labels).map(([k,v])=>`<button type="button" class="chip" data-cat="${k}"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${colors[k]};margin-right:5px"></span>${v}</button>`).join("");
  l.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{active=btn.dataset.cat;render();}));
}

function renderMainTable(){
  const table=document.getElementById("table");
  table.innerHTML="";
  for(let period=1;period<=7;period++){
    for(let group=1;group<=18;group++){
      const e=E.find(x=>x.period===period&&x.group===group&&x.cat!=="lanthanide"&&x.cat!=="actinide");
      if(period===6&&group===3){table.appendChild(makePlaceholder("57–71"));continue;}
      if(period===7&&group===3){table.appendChild(makePlaceholder("89–103"));continue;}
      if(e) table.appendChild(makeCell(e));
      else table.appendChild(document.createElement("div"));
    }
  }
}

function renderSeries(id,category){
  const el=document.getElementById(id);
  el.innerHTML="";
  const arr=E.filter(e=>e.cat===category);
  for(const e of arr) el.appendChild(makeCell(e));
}

function render(){
  renderMainTable();
  renderSeries("lanthanides","lanthanide");
  renderSeries("actinides","actinide");
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.dataset.cat===active));
}

function show(e){
  selected=e;
  document.getElementById("detail").classList.add("open");
  document.getElementById("bigSymbol").style.background=colors[e.cat]||"#64748b";
  document.getElementById("bigSymbol").textContent=e.sym;
  document.getElementById("detailName").textContent=e.name;
  document.getElementById("detailSub").textContent=`Atomic number ${e.z} • ${labels[e.cat]}`;
  document.getElementById("dMass").textContent=e.mass;
  document.getElementById("dEC").textContent=e.ec;
  document.getElementById("dPhase").textContent=e.phase;
  document.getElementById("dDesc").textContent=e.desc;
  document.getElementById("dZ").textContent=e.z;
  document.getElementById("dCat").textContent=labels[e.cat];
  document.getElementById("dGroup").textContent=e.group||"—";
  document.getElementById("dPeriod").textContent=e.period;
  document.getElementById("dYear").textContent=e.year||"Ancient / unknown";
  document.getElementById("dBlock").textContent=block(e)+"-block";
  document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function safeStorageGet(key){try{return localStorage.getItem(key)}catch(_e){return null}}
function safeStorageSet(key,value){try{localStorage.setItem(key,value)}catch(_e){}}

function init(){
  if(E.length!==118) throw new Error("Element data is incomplete: expected 118 elements, found "+E.length+".");
  const nums=new Set(E.map(e=>e.z));
  if(nums.size!==118 || !nums.has(118)) throw new Error("Element data validation failed.");

  document.getElementById("search").addEventListener("input",render);
  document.getElementById("closeBtn").addEventListener("click",()=>document.getElementById("detail").classList.remove("open"));
  document.getElementById("resetBtn").addEventListener("click",()=>{
    document.getElementById("search").value="";
    active="all";
    render();
    document.getElementById("detail").classList.remove("open");
  });
  document.getElementById("randomBtn").addEventListener("click",()=>show(E[Math.floor(Math.random()*E.length)]));
  document.getElementById("themeBtn").addEventListener("click",()=>{
    document.body.classList.toggle("dark");
    safeStorageSet("elementa-theme",document.body.classList.contains("dark")?"dark":"light");
  });

  if(safeStorageGet("elementa-theme")==="dark") document.body.classList.add("dark");
  renderLegend();
  render();
}

try{
  init();
}catch(err){
  console.error(err);
  const box=document.getElementById("error");
  box.style.display="block";
  box.textContent="Elementa could not start. JavaScript error: "+err.message;
}
</script>
